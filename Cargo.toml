[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.98.1"
repository = "https://github.com/CarlosEdDL/RL_Semaphore"
authors = ["Carlos Duque"]

[workspace.dependencies]
rl-semaphore-sim = { path = "crates/sim", version = "0.1.0" }
rl-semaphore-env = { path = "crates/env", version = "0.1.0" }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
proptest = "1"
rand_chacha = { version = "0.10", default-features = false }
insta = "1"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

# Optimize test binaries (the vehicle property tests run ~1,000 steps × 256 cases); debug assertions and overflow checks stay on.
[profile.test]
opt-level = 3
